name: Paper challenge build

on:
  push:
    branches: [main]
    paths:
      - 'evals/challenges/paper-plugin-lifecycle/**'
      - '.github/workflows/paper-challenge.yml'
  pull_request:
    paths:
      - 'evals/challenges/paper-plugin-lifecycle/**'
      - '.github/workflows/paper-challenge.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Run challenge starter tests and compile against Paper 1.21.11
        working-directory: evals/challenges/paper-plugin-lifecycle/starter
        run: gradle clean test build
